name: CodeQL
'on':
  push:
    branches:
    - rm
  pull_request:
    branches:
    - rm
  schedule:
  - cron: 7 3 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build_mode: none
    steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build_mode }}
        queries: security-extended
    - name: Analyze source
      uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        category: /language:${{ matrix.language }}
